# ============================================================
#  NeighborLink - Spring Boot Application Properties
# ============================================================

# Server
server.port=8080

# ── MySQL DataSource ──────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/neighbourlink?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Connection Pool (HikariCP) ────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JDBC Template ─────────────────────────────────────────────
spring.jdbc.template.query-timeout=30

# ── Logging ───────────────────────────────────────────────────
logging.level.com.neighborlink=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# ── CORS (allow frontend) ─────────────────────────────────────
# Handled in CorsConfig.java

# ── App Info ──────────────────────────────────────────────────
spring.application.name=neighborlink-backend
